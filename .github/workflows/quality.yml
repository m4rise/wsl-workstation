name: Quality

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_CONFIG_DIR: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_ROOT: ${{ github.workspace }}
      MISE_ENV: secrets
      MISE_ENABLE_TOOLS: shellcheck,shfmt,actionlint,gitleaks,lychee,taplo,ruff,age,github:jdx/fnox
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Zsh for syntax checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
      - name: Read shared bootstrap version
        id: bootstrap
        run: python3 scripts/bootstrap_metadata.py >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: ${{ steps.bootstrap.outputs.version }}
          install: false
          cache: false
      - run: mise install --locked
      - run: mise run workstation:lint
      - run: mise run security:audit
      - run: mise -E secrets run workstation:test
      - name: Prepare and verify committed public export
        run: |
          mise run publication:prepare --output "$RUNNER_TEMP/workstation-public"
          mise run publication:check --output "$RUNNER_TEMP/workstation-public"
      - name: Validate exported configuration
        env:
          MISE_CONFIG_DIR: ${{ runner.temp }}/workstation-public
          MISE_GLOBAL_CONFIG_ROOT: ${{ runner.temp }}/workstation-public
          MISE_STATE_DIR: ${{ runner.temp }}/export-state
          MISE_CACHE_DIR: ${{ runner.temp }}/export-cache
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}/workstation-public
        run: |
          cd "$MISE_CONFIG_DIR"
          mise run workstation:lint
          mise -E secrets run workstation:test
      - name: Archive public export with executable modes
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/public-export.tar.gz" workstation-public workstation-public.manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-export
          path: ${{ runner.temp }}/public-export.tar.gz
          retention-days: 7
          if-no-files-found: error

  bootstrap-wsl:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-export
          path: ${{ runner.temp }}/public-export
      - name: Install disposable Ubuntu 26.04 WSL distro
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu-26.04 --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --list --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap and verify fresh WSL distro
        shell: pwsh
        run: |
          $windowsArchive = (Join-Path $env:RUNNER_TEMP 'public-export/public-export.tar.gz').Replace('\', '/')
          $archiveOutput = wsl.exe --distribution Ubuntu-26.04 --user root -- wslpath -u $windowsArchive
          if ($LASTEXITCODE -ne 0 -or -not $archiveOutput) { throw 'Cannot locate the public archive from WSL' }
          $archive = ($archiveOutput | Out-String).Trim()
          wsl.exe --distribution Ubuntu-26.04 --user root -- mkdir -p /tmp/workstation-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --distribution Ubuntu-26.04 --user root -- tar --no-same-owner -xzf "$archive" -C /tmp/workstation-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkout = '/tmp/workstation-export/workstation-public'
          wsl.exe --distribution Ubuntu-26.04 --user root -- bash "$checkout/.github/scripts/bootstrap-wsl.sh" "$checkout"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
